<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign Up</title>
    <link rel="stylesheet"
        href="https://fonts.googleapis.com/css2?family=Cinzel:wght@700&family=Roboto:wght@400;500;700&display=swap">
    <link rel="stylesheet" href="styles.css">
</head>

<body>
    <div class="sidebar">
        <div class="logo-banner">
            <img src="images/odin-lined.png" alt="Odin logo">
            <h1>ODIN</h1>
        </div>
        <p class="photo-credit">
            Photo by Halie West on
            <a href="https://unsplash.com/photos/25xggax4bSA">Unsplash</a>
        </p>
    </div>

    <main class="content">
        <section class="intro">
            <p>This is not a real online service! You know you need something like this in your life to help you realize
                your deepest dreams. Sign up <em>now</em> to get started.</p>
            <p>You <em>know</em> you want to.</p>
        </section>

        <form id="signup" class="signup-form">
            <h2>Let's do this!</h2>
            <div class="fields">
                <div class="field">
                    <label for="first-name">First name</label>
                    <input type="text" id="first-name" name="first_name" required>
                </div>
                <div class="field">
                    <label for="last-name">Last name</label>
                    <input type="text" id="last-name" name="last_name" required>
                </div>
                <div class="field">
                    <label for="email">Email</label>
                    <input type="email" id="email" name="email" required>
                </div>
                <div class="field">
                    <label for="phone">Phone number</label>
                    <input type="tel" id="phone" name="phone">
                </div>
                <div class="field">
                    <label for="password">Password</label>
                    <input type="password" id="password" name="password" minlength="8" required>
                </div>
                <div class="field">
                    <label for="confirm-password">Confirm password</label>
                    <input type="password" id="confirm-password" name="confirm_password" minlength="8" required>
                </div>
            </div>
        </form>

        <div class="actions">
            <button type="submit" form="signup">Create Account</button>
            <p>Already have an account? <a href="#">Log in</a></p>
        </div>
    </main>

</body>

</html>
